<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🖼️ Dark Grid Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/css/lightbox.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* cố định 3 cột */
      gap: 15px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery a img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #444;
      transition: transform 0.3s ease;
    }

    .gallery a img:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <h1>📸 Thư viện ảnh</h1>
  <div class="gallery" id="gallery">Đang tải ảnh...</div>

  <script>
    const repo = 'nookc01/List Ảnh Tố Cáo Lừa Đảo';
    const branch = 'json';
    const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif'];

    async function fetchImages() {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/?ref=${branch}`);
      const files = await res.json();
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      files.forEach(file => {
        const name = file.name.toLowerCase();
        if (imageExtensions.some(ext => name.endsWith(ext))) {
          const rawUrl = `https://raw.githubusercontent.com/${repo}/${branch}/${file.name}`;
          const a = document.createElement('a');
          a.href = rawUrl;
          a.setAttribute('data-lightbox', 'gallery');
          a.setAttribute('data-title', file.name);
          const img = document.createElement('img');
          img.src = rawUrl;
          a.appendChild(img);
          gallery.appendChild(a);
        }
      });
    }

    fetchImages();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/js/lightbox.min.js"></script>
</body>
</html>
