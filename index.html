<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>📷 Auto Gallery</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; text-align: center; }
    img { margin: 10px; border: 1px solid #ccc; border-radius: 6px; max-width: 90%; height: auto; }
  </style>
</head>
<body>
  <h1>📸 Tự động hiển thị ảnh</h1>
  <div id="gallery">Đang tải ảnh...</div>

  <script>
    const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif'];
    const repo = 'nookc01/List-Skin-Bug'; // Thay bằng tên repo bạn nếu khác
    const branch = 'json';

    async function fetchImages() {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/?ref=${branch}`);
      const files = await res.json();

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      files.forEach(file => {
        const name = file.name.toLowerCase();
        if (imageExtensions.some(ext => name.endsWith(ext))) {
          const img = document.createElement('img');
          img.src = `https://raw.githubusercontent.com/${repo}/${branch}/${file.name}`;
          gallery.appendChild(img);
        }
      });
    }

    fetchImages();
  </script>
</body>
</html>
